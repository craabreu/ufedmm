name: Docs

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  release:
    types: [published]
  # Rebuild the docs of an existing release tag (also updates latest)
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild, such as v0.2.0"
        required: true

jobs:
  build_and_deploy_docs:
    name: Documentation Building and Deployment
    runs-on: ubuntu-latest
    # Prereleases are not deployed
    if: github.event_name != 'release' || !github.event.release.prerelease

    steps:
      - name: Validate release tag
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag '$TAG' (expected vX.Y.Z)"; exit 1; }
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/docs_env.yaml
          environment-name: docs
          create-args: >-
            python=3.13 openmm=8.6

      - name: Install package
        # conda setup requires this special shell
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps
          micromamba list

      - name: Run tests
        shell: bash -l {0}
        run: |
          pytest -v --cov=ufedmm --cov-report=term --cov-report=html

      - name: Build Documentation
        shell: bash -l {0}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            export UFEDMM_VERSION=$RELEASE_TAG
          else
            export UFEDMM_VERSION=dev
          fi
          sphinx-build ./docs ./html
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Get coverage report
        id:  coverage
        shell: bash -l {0}
        run: |
          COVERAGE=$(coverage report | tail -1 | awk '{print $4}')
          OFFSET=$(((${COVERAGE::-1}-35)/6-1))
          [[ $OFFSET < 0 ]] && OFFSET=0
          PALETTE="000111222333"
          CODE=${PALETTE:$OFFSET:3}
          COLOR=$(echo $CODE | sed -e "s/0/red,/g; s/1/orange,/g; s/2/yellow,/g; s/3/green,/g; s/,$//")
          echo "coverage=${COVERAGE}" | tee -a "${GITHUB_OUTPUT}"
          echo "color=${COLOR}" | tee -a "${GITHUB_OUTPUT}"

      - name: Generate coverage badge
        uses: emibcn/badge-action@v2.0.2
        with:
          label: 'Coverage'
          label-color: 'black'
          status: ${{ steps.coverage.outputs.coverage }}
          color: ${{ steps.coverage.outputs.color }}
          path: 'htmlcov/coverage.svg'

      - name: Deploy documentation
        shell: bash -l {0}
        run: |
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            echo "Deployment is deactivated on pull requests"
            exit 0
          elif [ -n "$RELEASE_TAG" ]; then
            subdirs=($RELEASE_TAG latest)
          else
            subdirs=(development)
          fi
          git reset --hard HEAD
          set -x
          echo "::group::Push page to gh-pages branch"
          git config user.name "$(git show --format=%an -s)"
          git config user.email "$(git show --format=%ae -s)"
          git fetch origin
          git switch gh-pages
          for subdir in ${subdirs[@]}; do
            dir=docs/$subdir
            rsync -va --delete-excluded html/ $dir/
            rsync -va --delete-excluded htmlcov/ $dir/coverage/
            git add -f $dir/*
          done
          touch docs/.nojekyll
          git commit -m "Docs from $GITHUB_REF $GITHUB_SHA" || echo "Branch is up to date"
          git push -f origin gh-pages
          echo "::endgroup::"
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
