name: Anaconda

on:
  release:
    types: [published]
  # Rebuild and upload the package of an existing release tag
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, such as v0.2.0"
        required: true

jobs:
  test:
    name: Build on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Prereleases are not deployed
    if: github.event_name != 'release' || !github.event.release.prerelease
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag '$TAG' (expected vX.Y.Z)"; exit 1; }
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/deployment_env.yaml
          environment-name: test
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps
          micromamba list

      - name: Conda Build and Upload
        shell: bash -l {0}
        working-directory: ./devtools/conda-recipes/anaconda
        run: |
          export UFEDMM_VERSION=${{ inputs.tag || github.event.release.tag_name }}
          echo "::group::Building conda package for ufedmm $UFEDMM_VERSION"
          outdir=$(mktemp -d)
          conda build . --no-anaconda-upload -c conda-forge -c mdtools --output-folder $outdir
          echo "::endgroup::"
          echo "::group::Uploading package to mdtools conda channel"
          PACKAGE=$(find $outdir \( -name '*.conda' -o -name '*.tar.bz2' \) | head -1)
          test -n "$PACKAGE" || { echo "No conda package found in $outdir"; exit 1; }
          export ANACONDA_API_TOKEN=${{ secrets.ANACONDA_TOKEN }}
          anaconda upload --user mdtools --force --label main $PACKAGE
          echo "::endgroup::"
