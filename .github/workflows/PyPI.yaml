name: PyPI

on:
  release:
    types: [published]
  # Rebuild and upload the distribution of an existing release tag
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, such as v0.2.0"
        required: true

jobs:
  test:
    name: Build on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Prereleases are not deployed
    if: github.event_name != 'release' || !github.event.release.prerelease
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag '$TAG' (expected vX.Y.Z)"; exit 1; }
          grep -qx "__version__ = \"${TAG#v}\"" ufedmm/_version.py || { echo "ufedmm/_version.py does not match $TAG"; exit 1; }
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/deployment_env.yaml
          environment-name: test
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps
          micromamba list

      - name: PyPI Build and Upload
        shell: bash -l {0}
        run: |
          export UFEDMM_VERSION=${{ inputs.tag || github.event.release.tag_name }}
          echo "::group::Building PyPI distribution for ufedmm $UFEDMM_VERSION"
          python -m build
          python -m twine upload -u __token__ -p ${{ secrets.PYPI_TOKEN }} --repository pypi --skip-existing dist/*
          echo "::endgroup::"
